[package]
name = "radview"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
description = "Fast GPU viewer for SAR and ISAR images (NITF SICD/SIDD, TIFF, BigTIFF, COG)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/polymood/radview"
readme = "README.md"
keywords = ["sar", "nitf", "sicd", "geotiff", "wgpu"]
categories = ["science::geo", "visualization"]

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
egui = "0.36"
egui-wgpu = "0.36"
egui-winit = "0.36"
half = { version = "2.7.1", features = ["bytemuck", "std"] }
libdeflater = "1.26.1"
memmap2 = "0.9.11"
pollster = "1.0.1"
rayon = "1.12.0"
rfd = "0.17.2"
weezl = "0.2.1"
wgpu = "30.0.1"
winit = "0.30.13"
zstd = "0.14.0"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
