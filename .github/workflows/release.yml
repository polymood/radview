name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # The x86_64 macOS binary cannot run on the arm64 runner.
      - name: Test
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --release --locked --target ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="radview-${GITHUB_REF_NAME#v}-${{ matrix.target }}"
          mkdir "$name"
          bin="target/${{ matrix.target }}/release/radview"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          cp "$bin" README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "$name/"
          if [ "$RUNNER_OS" = Windows ]; then 7z a "$name.zip" "$name" > /dev/null; else tar czf "$name.tar.gz" "$name"; fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            radview-*.tar.gz
            radview-*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum radview-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/radview-*
      - name: Release notes
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" 'index($0, "## [" v "]") == 1 {f = 1; next} /^## \[/ {f = 0} /^\[[^]]*\]: / {next} f' CHANGELOG.md > notes.md
          cat >> notes.md <<EOF
          ## Downloads

          | System | File |
          |---|---|
          | Windows x86_64 | \`radview-$v-x86_64-pc-windows-msvc.zip\` |
          | Linux x86_64 (glibc 2.35 or later) | \`radview-$v-x86_64-unknown-linux-gnu.tar.gz\` |
          | Linux arm64 (glibc 2.35 or later) | \`radview-$v-aarch64-unknown-linux-gnu.tar.gz\` |
          | macOS Apple silicon | \`radview-$v-aarch64-apple-darwin.tar.gz\` |
          | macOS Intel | \`radview-$v-x86_64-apple-darwin.tar.gz\` |

          The x86_64 binaries need a CPU with AVX2 (Intel Haswell, AMD Excavator or later).

          The macOS binaries are not signed. Before the first start, remove the quarantine attribute: \`xattr -d com.apple.quarantine radview\`.

          ## Verify the download

          SHA-256 checksums:

          \`\`\`
          sha256sum -c SHA256SUMS.txt --ignore-missing
          \`\`\`

          Build provenance (GitHub CLI):

          \`\`\`
          gh attestation verify radview-$v-<target>.tar.gz --repo $GITHUB_REPOSITORY
          \`\`\`
          EOF
          cat notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "radview $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
